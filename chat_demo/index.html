<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot de atención · demo</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --texto: #1d2733; --suave: #66727f;
    --borde: #d9dee5; --cliente: #2f6fed; --bot: #f1f3f6; --asesor: #fff4d6;
    --ok: #1f8a4c; --alerta: #b4561b; --gris: #8a94a0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c; --panel: #1a2129; --texto: #e6ebf0; --suave: #9aa6b2;
      --borde: #2b3540; --cliente: #3d7bf2; --bot: #242d37; --asesor: #3a3220;
      --ok: #4cc07f; --alerta: #f0934f; --gris: #7d8894;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--texto); }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px;
         display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; }
  .chat { display: flex; flex-direction: column; height: 78vh; min-height: 480px; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--borde); }
  header b { display: block; }
  header small { color: var(--suave); }
  #mensajes { flex: 1; overflow-y: auto; padding: 18px; display: flex;
              flex-direction: column; gap: 8px; }
  .m { max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; }
  .cliente { align-self: flex-end; background: var(--cliente); color: #fff;
             border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .derivar { background: var(--asesor); }
  .sistema { align-self: center; color: var(--suave); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--borde); }
  input, select { font: inherit; color: inherit; background: var(--bg);
                  border: 1px solid var(--borde); border-radius: 8px; padding: 9px 11px; }
  form input { flex: 1; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 16px;
           background: var(--cliente); color: #fff; cursor: pointer; }
  button.sec { background: transparent; color: var(--texto); border: 1px solid var(--borde); }
  aside { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  aside h2 { font-size: 14px; margin: 0; color: var(--suave); text-transform: uppercase;
             letter-spacing: .04em; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--suave); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font-size: 13px; padding: 5px 10px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
  dt { color: var(--suave); }
  dd { margin: 0; word-break: break-word; }
  .accion-responder { color: var(--ok); font-weight: 600; }
  .accion-derivar { color: var(--alerta); font-weight: 600; }
  .accion-silencio { color: var(--gris); font-weight: 600; }
</style>
</head>
<body>
<main>
  <section class="chat">
    <header>
      <b id="negocio">Asistente</b>
      <small id="modo-texto">Modo simulado: la lógica corre en este navegador</small>
    </header>
    <div id="mensajes" aria-live="polite"></div>
    <form id="form">
      <input id="texto" autocomplete="off" placeholder="Escribe como si fueras un cliente…" autofocus>
      <button>Enviar</button>
    </form>
  </section>

  <section>
    <aside>
      <h2>Conexión</h2>
      <label>Modo
        <select id="modo">
          <option value="simulado">Simulado (sin n8n)</option>
          <option value="n8n">n8n real</option>
        </select>
      </label>
      <label>URL del webhook
        <input id="url" value="http://localhost:5678/webhook/bot-demo">
      </label>

      <h2>Prueba rápida</h2>
      <div class="chips" id="chips"></div>
      <button class="sec" id="reiniciar" type="button">Nueva conversación</button>

      <h2>Qué decidió el flujo</h2>
      <dl>
        <dt>Acción</dt><dd id="d-accion">—</dd>
        <dt>Intención</dt><dd id="d-intencion">—</dd>
        <dt>Puntaje</dt><dd id="d-puntaje">—</dd>
        <dt>Contexto IA</dt><dd id="d-contexto">—</dd>
      </dl>
    </aside>
  </section>
</main>

<script src="motor.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const EJEMPLOS = ['hola', '¿cuánto cuestan los lentes?', '¿aceptan Yape?',
    '¿atienden los domingos?', 'quién ganó el partido', 'quiero hablar con un asesor', 'menu'];

  let estado = {};
  let chatId = nuevoChat();
  const indice = MotorBot.indexar(MotorBot.FAQ_DOC.faq);
  $('negocio').textContent = MotorBot.FAQ_DOC.negocio;

  function nuevoChat() { return 'web-' + Math.random().toString(36).slice(2, 8); }

  function burbuja(texto, clase) {
    const d = document.createElement('div');
    d.className = 'm ' + clase;
    d.textContent = texto;
    $('mensajes').appendChild(d);
    $('mensajes').scrollTop = $('mensajes').scrollHeight;
  }

  function mostrarDecision(r) {
    $('d-accion').innerHTML = '';
    const s = document.createElement('span');
    s.className = 'accion-' + r.accion;
    s.textContent = r.accion;
    $('d-accion').appendChild(s);
    $('d-intencion').textContent = r.intencion;
    $('d-puntaje').textContent = r.puntaje;
    $('d-contexto').textContent = r.contexto.map((c) => c.id).join(', ') || '—';
  }

  async function decidir(texto) {
    const mensaje = { chat_id: chatId, nombre: 'Visitante', texto,
                      fecha: Math.floor(Date.now() / 1000) };
    if ($('modo').value === 'simulado') {
      return MotorBot.procesarMensaje(mensaje, estado, MotorBot.FAQ_DOC, indice);
    }
    const res = await fetch($('url').value, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mensaje),
    });
    if (!res.ok) throw new Error('n8n respondió ' + res.status +
      (res.status === 404 ? ': ¿el workflow está activo?' : ''));
    return res.json();
  }

  async function enviar(texto) {
    burbuja(texto || '(mensaje vacío)', 'cliente');
    try {
      const r = await decidir(texto);
      mostrarDecision(r);
      if (r.accion === 'silencio') burbuja('Un asesor tiene esta conversación; el bot no responde.', 'sistema');
      else burbuja(r.respuesta, r.accion === 'derivar' ? 'bot derivar' : 'bot');
      if (r.accion === 'derivar') burbuja('Aviso enviado al equipo: ' + r.aviso_equipo, 'sistema');
    } catch (e) {
      burbuja('No se pudo conectar: ' + e.message, 'sistema');
    }
  }

  $('form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const t = $('texto').value;
    $('texto').value = '';
    enviar(t);
  });

  for (const e of EJEMPLOS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sec'; b.textContent = e;
    b.onclick = () => enviar(e);
    $('chips').appendChild(b);
  }

  $('modo').addEventListener('change', () => {
    $('modo-texto').textContent = $('modo').value === 'simulado'
      ? 'Modo simulado: la lógica corre en este navegador'
      : 'Conectado a n8n: cada mensaje ejecuta el workflow';
  });

  $('reiniciar').onclick = () => {
    estado = {}; chatId = nuevoChat();
    $('mensajes').innerHTML = '';
    burbuja('Nueva conversación', 'sistema');
  };

  burbuja('Nueva conversación', 'sistema');
</script>
</body>
</html>
